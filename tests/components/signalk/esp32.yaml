esphome:
  name: signalk_example
  friendly_name: SignalK Example

esp32:
  board: esp32dev
  framework:
    type: arduino

# ota:
#   - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:
  level: DEBUG

signalk:
  host: 192.168.0.3
  # port: 3000 (Optional defaults to 3000)

sensor:
  - platform: signalk
    id: environment_wind_speedApparent
    path: environment.wind.speedApparent
    # period: 1000
    # format: "delta"
    # policy: "instant"
    # minperiod: 200

    accuracy_decimals: 2
    on_value:
      - logger.log:
          format: "Wind speed %.1f"
          args: ['x']
          level: INFO

text_sensor:
  - platform: signalk
    id: propulsion_p1_state
    path: propulsion.p1.state
    on_value:
      - logger.log:
          format: "Propulsion state %s"
          args: ['x.c_str()']
          level: INFO
